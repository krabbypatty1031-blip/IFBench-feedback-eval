# Official freeze inputs. No secrets.
# HKBU GenAI has no published CNY tariff and no /user/balance.
# The official stop is call_cap; do not treat prior DeepSeek spend as this wallet.
protocol: feedback-eval-official-hkbu-v1
code_version: store-v1
paths:
  data: data/IFBench_test.jsonl
  split: configs/feedback_eval/split.json
  prompts: configs/feedback_eval/prompts.json
  homology: configs/feedback_eval/homology.json
  constraint_support: configs/feedback_eval/constraint_support.json
parameters:
  temperature: 0.0
  max_tokens: 4096
  seed: 42
  thinking:
    type: disabled
retry:
  rate_limit_retries: 1
  timeout_retries: 0
  timeout_s: 300.0
  missing_data_rule: report_missing_do_not_impute
scoring:
  primary_metric: strict_prompt_level
  official_strict: evaluation_lib.test_instruction_following_strict
  official_loose: evaluation_lib.test_instruction_following_loose
  loose_is_not_human_judgment: true
feedback:
  b2: overall_strict_status
  b3: per_constraint_strict_plus_prompt_text
  verifier_error: skip_revision_record_feedback_unavailable
  mapping_error: skip_revision_record_feedback_unavailable
human_review:
  n_items: 260
  seed: 42
  split: test
  blinding: hide_model_and_condition
  coverage: all_test_items
  note: Content labels cover every test identity (260 items × 2 models × 4 conditions).
cost_cap:
  amount: null
  currency: null
  unit: calls
  call_cap: 2288
  status: confirmed
  note: 2080 planned outputs plus 10 percent retry headroom. Campus quota is not a CNY wallet.
budget_planning:
  n_test_items: 260
  n_models: 2
  n_conditions: 4
  planned_outputs: 2080
  retry_uplift: 0.1
  repeatability_outputs: 0
trial:
  n_dev_items: 4
  paid_n_dev_items: 1
  split: test
  call_limit: 0
  require_authorization: true
  authorization_env: FEEDBACK_EVAL_AUTHORIZE_SPEND
models:
  - slot: model_a
    id: gpt-4.1
    provider: azure
    api_base: https://genai.hkbu.edu.hk/general/rest
    availability: verified
    unit_price:
      input_per_million: null
      output_per_million: null
      currency: null
      source: unverified
  - slot: model_b
    id: gpt-4o
    provider: azure
    api_base: https://genai.hkbu.edu.hk/general/rest
    availability: verified
    unit_price:
      input_per_million: null
      output_per_million: null
      currency: null
      source: unverified
